name: Verify

on:
  pull_request:
  push:
    branches:
    - main

concurrency:
  group: pcs-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:japanese-name-dictionary
      - run: npm run verify:ci
